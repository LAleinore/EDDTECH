services:
  db:
    image: postgres:16-alpine
    container_name: edumind_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: edumind_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/migrations/20261120_init_schema.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./supabase/migrations/20261120_seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edumind_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/edumind_db
      - SECRET_KEY=edumind-super-secure-production-secret-key-32-chars!
      - ENVIRONMENT=production
      - DEBUG=False
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
